# Lo unico que este jar necesita saber por si mismo: su nombre y donde esta el
# Config Server. El resto de su configuracion (puerto, seguridad, broker,
# Resilience4j) se descarga al arrancar desde ${CONFIG_HOST}:8888 y vive
# versionada en un solo lugar.
spring:
  application:
    name: movimientos-service
  config:
    import: "configserver:http://${CONFIG_HOST:localhost}:8888"
  cloud:
    config:
      username: ${CONFIG_USER:banco-config}
      password: ${CONFIG_PASSWORD:banco-config-secret}
      # Sin esto, un Config Server caido deja al servicio arrancando con la
      # configuracion por defecto de Spring: puerto 8080, sin seguridad y sin
      # registrarse en Eureka. Es mejor que no arranque.
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        max-interval: 5000
