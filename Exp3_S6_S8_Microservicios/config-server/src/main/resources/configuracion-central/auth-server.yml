server:
  port: 9000

spring:
  security:
    oauth2:
      authorizationserver:
        # El "issuer" queda explicito y es el mismo valor que los Resource
        # Servers exigen en el claim iss del token. Al fijarlo aqui, un token
        # pedido desde el host (localhost:9000, publicado por Docker) sigue
        # llevando el issuer de la red interna y los microservicios lo validan
        # sin aflojar la comprobacion.
        issuer: ${AUTH_ISSUER_URI:http://localhost:9000}

banco:
  oauth2:
    # Los secretos de los clientes se configuran, no se compilan. El valor por
    # defecto permite levantar el ecosistema en local sin preparar nada; en un
    # despliegue real vendrian de un gestor de secretos.
    clientes:
      banco-web: ${WEB_CLIENT_SECRET:banco-web-secret}
      cajero: ${CAJERO_CLIENT_SECRET:cajero-secret}
      movimientos-service: ${MOVIMIENTOS_CLIENT_SECRET:movimientos-secret}
