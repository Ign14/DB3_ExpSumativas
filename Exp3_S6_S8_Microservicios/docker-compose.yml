# Orquestacion completa del ecosistema: siete contenedores en una red propia.
#
# La parte que importa de este archivo no es la lista de servicios, sino el
# orden. Un microservicio que arranca antes que el Config Server no obtiene su
# configuracion, y uno que arranca antes que Eureka no se registra. Por eso cada
# dependencia se declara con "condition: service_healthy" contra el endpoint de
# salud real del servicio, y no con un depends_on simple, que solo espera a que
# el contenedor exista y no a que el servicio dentro este listo.
#
# Los nombres de servicio de esta seccion son los nombres DNS dentro de la red:
# por eso las variables de entorno apuntan a "config-server" o "broker-artemis"
# y no a localhost. En local, las mismas variables tienen localhost por defecto,
# asi que el codigo y la configuracion son los mismos en los dos entornos.

name: banco-xyz-microservicios

services:

  config-server:
    build:
      context: .
      args:
        MODULE: config-server
    image: banco-xyz/config-server:1.0.0
    container_name: config-server
    environment:
      CONFIG_USER: ${CONFIG_USER:-banco-config}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:-banco-config-secret}
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [banco]

  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-server
    image: banco-xyz/discovery-server:1.0.0
    container_name: discovery-server
    environment:
      EUREKA_USER: ${EUREKA_USER:-banco-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-banco-eureka-secret}
      # El nombre con el que el servidor se reconoce a si mismo dentro de la red,
      # para no tratarse como un nodo par y replicarse a si mismo.
      EUREKA_SELF_HOST: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [banco]

  broker-artemis:
    build:
      context: .
      args:
        MODULE: broker-artemis
    image: banco-xyz/broker-artemis:1.0.0
    container_name: broker-artemis
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis-secret}
    ports:
      # Solo el puerto de salud. El 61616 no se publica al host: el broker lo
      # necesitan los microservicios de esta red y nadie mas, y publicar un
      # puerto de mensajeria es dar un camino de escritura al dominio que no pasa
      # por el gateway. Para inspeccionarlo desde el host:
      #   docker compose exec broker-artemis curl -s localhost:61617/actuator/health
      - "61617:61617"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:61617/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [banco]

  auth-server:
    build:
      context: .
      args:
        MODULE: auth-server
    image: banco-xyz/auth-server:1.0.0
    container_name: auth-server
    environment:
      CONFIG_HOST: config-server
      CONFIG_USER: ${CONFIG_USER:-banco-config}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:-banco-config-secret}
      EUREKA_HOST: discovery-server
      EUREKA_USER: ${EUREKA_USER:-banco-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-banco-eureka-secret}
      # El issuer es el nombre interno y no localhost, porque es la direccion
      # con la que los microservicios alcanzan al auth-server para bajar la
      # clave publica. El token pedido desde el host por el puerto publicado
      # lleva este mismo issuer, asi que los Resource Servers lo validan sin
      # tener que aflojar la comprobacion.
      AUTH_ISSUER_URI: http://auth-server:9000
      # Los secretos de los clientes OAuth2. El de movimientos-service tiene que
      # ser el mismo que recibe ese servicio: uno lo registra, el otro lo presenta.
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:-banco-web-secret}
      CAJERO_CLIENT_SECRET: ${CAJERO_CLIENT_SECRET:-cajero-secret}
      MOVIMIENTOS_CLIENT_SECRET: ${MOVIMIENTOS_CLIENT_SECRET:-movimientos-secret}
    ports:
      - "9000:9000"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [banco]

  cuentas-service:
    build:
      context: .
      args:
        MODULE: cuentas-service
    image: banco-xyz/cuentas-service:1.0.0
    container_name: cuentas-service
    environment:
      CONFIG_HOST: config-server
      CONFIG_USER: ${CONFIG_USER:-banco-config}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:-banco-config-secret}
      EUREKA_HOST: discovery-server
      EUREKA_USER: ${EUREKA_USER:-banco-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-banco-eureka-secret}
      ARTEMIS_HOST: broker-artemis
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis-secret}
      AUTH_ISSUER_URI: http://auth-server:9000
    ports:
      # Publicado para poder llamar al microservicio sin pasar por el gateway y
      # comprobar que tambien exige el token por si mismo.
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      broker-artemis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [banco]

  movimientos-service:
    build:
      context: .
      args:
        MODULE: movimientos-service
    image: banco-xyz/movimientos-service:1.0.0
    container_name: movimientos-service
    environment:
      CONFIG_HOST: config-server
      CONFIG_USER: ${CONFIG_USER:-banco-config}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:-banco-config-secret}
      EUREKA_HOST: discovery-server
      EUREKA_USER: ${EUREKA_USER:-banco-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-banco-eureka-secret}
      ARTEMIS_HOST: broker-artemis
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis-secret}
      AUTH_ISSUER_URI: http://auth-server:9000
      MOVIMIENTOS_CLIENT_SECRET: ${MOVIMIENTOS_CLIENT_SECRET:-movimientos-secret}
      CUENTAS_HOST: cuentas-service
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      broker-artemis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [banco]

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    image: banco-xyz/api-gateway:1.0.0
    container_name: api-gateway
    environment:
      CONFIG_HOST: config-server
      CONFIG_USER: ${CONFIG_USER:-banco-config}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:-banco-config-secret}
      EUREKA_HOST: discovery-server
      EUREKA_USER: ${EUREKA_USER:-banco-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-banco-eureka-secret}
      AUTH_ISSUER_URI: http://auth-server:9000
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [banco]

networks:
  banco:
    driver: bridge
