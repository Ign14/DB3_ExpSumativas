# Igual que los demas microservicios: el jar solo sabe su nombre y donde esta el
# Config Server. Puerto, seguridad y broker se descargan al arrancar.
spring:
  application:
    name: clientes-service
  config:
    import: "configserver:http://${CONFIG_HOST:localhost}:8888"
  cloud:
    config:
      username: ${CONFIG_USER:banco-config}
      password: ${CONFIG_PASSWORD:banco-config-secret}
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        max-interval: 5000
