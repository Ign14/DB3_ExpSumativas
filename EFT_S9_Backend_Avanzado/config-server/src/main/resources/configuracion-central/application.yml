# Configuracion comun a todos los microservicios que consumen este Config
# Server. Lo que esta aqui no se repite en el jar de cada servicio: cambiarlo
# en un solo lugar cambia el comportamiento de todo el ecosistema.

eureka:
  client:
    service-url:
      # Las credenciales viajan en la URL porque es la forma en que el cliente
      # de Eureka envia autenticacion basica.
      defaultZone: http://${EUREKA_USER:banco-eureka}:${EUREKA_PASSWORD:banco-eureka-secret}@${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    # Por defecto el cliente refresca su copia del registro cada 30 segundos y
    # pide solo los cambios (delta). Eso tiene dos efectos molestos en un
    # ecosistema chico: tras levantar un servicio, el gateway tarda hasta medio
    # minuto en poder enrutar hacia el, y si una instancia se reinicia con el
    # mismo identificador, el delta puede traer la baja de la instancia anterior
    # despues del alta de la nueva y dejarla fuera del cache del cliente hasta
    # el refresco siguiente. Con un refresco corto y el registro completo en
    # cada consulta, el costo es despreciable para los cinco servicios que se
    # registran, y el
    # registro converge en segundos.
    registry-fetch-interval-seconds: 5
    disable-delta: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        # Se exponen los endpoints de Resilience4j para poder observar el
        # estado del circuit breaker durante la demostracion.
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    health:
      # No "always": el healthcheck de Docker solo necesita el estado, y el
      # detalle completo nombra el Config Server, los property sources en uso y
      # el inventario de servicios registrados. Es reconocimiento gratuito para
      # quien alcance el puerto sin credenciales.
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    cl.duoc.bancoxyz: INFO

# Cliente de Kafka, comun a los tres microservicios de negocio. La direccion del
# broker es lo unico que cambia entre la ejecucion local (el modulo
# broker-kafka) y la orquestacion en Docker (la imagen oficial de Apache Kafka):
# ningun servicio sabe cual de los dos tiene al frente.
spring:
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all: el envio no se da por bueno hasta que las replicas en sincronia
      # confirmaron. Con una sola replica da lo mismo, pero el dia que el topico
      # tenga tres, la diferencia entre perder y no perder un evento ante la
      # caida de un broker esta en esta linea.
      acks: all
      retries: 3
      properties:
        # El productor no escribe el nombre de su clase en los encabezados. Los
        # consumidores declaran a que tipo deserializar, asi que ese encabezado
        # solo acoplaria los servicios por el nombre de sus paquetes.
        spring.json.add.type.headers: false
        # Sin esto, un reintento del productor puede dejar el mismo evento dos
        # veces en el topico.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 4000
        # Cuanto espera el productor por los metadatos del topico antes de
        # rendirse. Por defecto son 60 s, y ese seria el tiempo que un broker
        # caido dejaria bloqueada la peticion HTTP que publica el evento.
        max.block.ms: 4000
    consumer:
      # Un consumidor que arranca por primera vez lee el topico desde el
      # comienzo. Con "latest" se perderia todo lo publicado mientras el
      # servicio no existia, que es justo lo que un topico con retencion viene
      # a evitar.
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # El offset se confirma despues de que el listener termino sin excepcion.
      # Con el modo por defecto podria confirmarse un lote cuyo procesamiento
      # fallo a mitad de camino.
      ack-mode: RECORD
