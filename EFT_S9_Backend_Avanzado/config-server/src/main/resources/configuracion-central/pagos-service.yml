server:
  port: 8082

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
          # Indicar el jwk-set-uri explicitamente evita que este servicio
          # consulte los metadatos del auth-server durante el arranque: baja a
          # buscar la clave publica la primera vez que valida un token. Asi el
          # orden de arranque entre servicios deja de ser critico, sin perder la
          # validacion del issuer, que sigue activa por la linea anterior.
          jwk-set-uri: ${AUTH_ISSUER_URI:http://localhost:9000}/oauth2/jwks
      # Este servicio es ademas cliente OAuth2: para llamar a cuentas-service
      # necesita su propio token, que obtiene por client_credentials.
      client:
        registration:
          cuentas-client:
            provider: banco-auth
            client-id: pagos-service
            client-secret: ${PAGOS_CLIENT_SECRET:pagos-secret}
            authorization-grant-type: client_credentials
            # Este servicio ya no solo lee cuentas: un deposito y una
            # transferencia mueven saldo. El scope que lo permite es
            # cuentas.liquidar y no cuentas.write, y la diferencia importa:
            # cuentas.write autoriza a pedir un retiro, que es una operacion de
            # canal con su propio limite y su propio evento, y este servicio no
            # tiene por que poder pedirla. Lo que necesita es cargar y abonar las
            # puntas de la operacion que el mismo orquesta.
            scope: cuentas.read,cuentas.liquidar
        provider:
          banco-auth:
            token-uri: ${AUTH_ISSUER_URI:http://localhost:9000}/oauth2/token
  artemis:
    mode: native
    # callTimeout acota cuanto espera el cliente una respuesta del broker. Por
    # defecto son 30 s, y ese es el tiempo que un broker colgado dejaria
    # bloqueado el hilo que atiende el retiro antes de poder responder.
    broker-url: tcp://${ARTEMIS_HOST:localhost}:61616?callTimeout=4000&connectionTTL=30000
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD:artemis}

banco:
  cuentas-service:
    # El host no es un host: es el nombre con el que cuentas-service se registra
    # en Eureka. El cliente balanceado lo resuelve a una de las instancias vivas
    # en cada peticion. Para apuntar a una instancia concreta (por ejemplo al
    # depurar en local sin Eureka) basta sobrescribir esta propiedad con una URL
    # normal y quitar @LoadBalanced del constructor.
    url: http://cuentas-service
  pagos:
    # Limite por operacion de deposito y transferencia. Es una regla del
    # negocio y vive en configuracion, igual que el limite de retiro del
    # dominio de cuentas.
    limite-por-operacion: 1000000

# Tolerancia a fallos sobre la llamada saliente hacia cuentas-service.
#
# Los numeros forman un presupuesto de tiempo que tiene que ser coherente con los
# timeouts del cliente HTTP (1 s de conexion + 1 s de lectura = 2 s por intento,
# en ClienteCuentasConfig):
#
#   por intento:  2 s de HTTP, acotados por el TimeLimiter en 2 s
#   peor caso:    2 s + 0,2 s de espera + 2 s = 4,2 s para la respuesta degradada
#
# Si el TimeLimiter fuera mas corto que el peor caso del HTTP, cortaria la espera
# del cliente pero dejaria la peticion viva ocupando un hilo; si fuera mas largo,
# el que acotaria de verdad seria el cliente HTTP y el TimeLimiter no serviria de
# nada.
resilience4j:
  circuitbreaker:
    instances:
      cuentas:
        register-health-indicator: true
        # Sin buffer no hay historial de eventos que mostrar en
        # /actuator/circuitbreakerevents ni /actuator/retryevents.
        event-consumer-buffer-size: 100
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Con 2 intentos por peticion, bastan 2 peticiones fallidas para tener
        # datos suficientes y abrir el circuito.
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Solo cuenta como fallo que el servicio no responda. Un 404 significa
        # que respondio bien y la cuenta no existe: si contara como fallo,
        # consultar cuentas inexistentes abriria el circuito de las validas.
        # Y LlamadaRechazadaException (401, 403, 400) tampoco esta: es un problema
        # de configuracion permanente, y abrir el circuito solo lo disfrazaria de
        # caida pasajera.
        record-exceptions:
          - cl.duoc.bancoxyz.common.excepcion.ServicioNoDisponibleException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      cuentas:
        # Dos intentos, no tres: contra un servicio caido, el tercero agrega mas
        # de dos segundos a la espera del usuario para muy poca probabilidad extra
        # de exito. El fallo sostenido lo resuelve el circuit breaker, no insistir.
        max-attempts: 2
        wait-duration: 200ms
        event-consumer-buffer-size: 100
        retry-exceptions:
          - cl.duoc.bancoxyz.common.excepcion.ServicioNoDisponibleException
          - java.util.concurrent.TimeoutException
        # Reintentar contra un circuito abierto es gastar tiempo en algo que ya
        # sabemos que va a fallar: se va directo al fallback.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - cl.duoc.bancoxyz.common.excepcion.LlamadaRechazadaException
  timelimiter:
    instances:
      cuentas:
        timeout-duration: 2s
        cancel-running-future: true
