server:
  port: 8092
  compression:
    enabled: true
    mime-types: application/json

spring:
  application:
    name: bff-movil
  security:
    oauth2:
      client:
        registration:
          # El canal movil es de solo lectura. Un telefono que se pierde o se
          # presta no deberia poder mover dinero con el token que lleva dentro.
          movil:
            provider: banco-auth
            client-id: banco-movil-client
            client-secret: ${MOVIL_CLIENT_SECRET:banco-movil-secret}
            authorization-grant-type: client_credentials
            scope: cuentas.read,movimientos.read,clientes.read
        provider:
          banco-auth:
            token-uri: ${AUTH_ISSUER_URI:http://localhost:9000}/oauth2/token

bff:
  gateway:
    url: http://${GATEWAY_HOST:localhost}:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    cl.duoc.bancoxyz.bff: INFO
