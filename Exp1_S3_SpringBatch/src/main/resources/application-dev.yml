# Perfil de desarrollo / pruebas rápidas: base de datos H2 embebida en memoria.
# Se usa para validar el proyecto y generar evidencia de ejecución local sin
# depender de un motor de base de datos externo.
spring:
  datasource:
    url: jdbc:h2:mem:bancoxyz;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
