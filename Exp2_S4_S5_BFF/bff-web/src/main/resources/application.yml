server:
  port: 8091
  # El canal web es el que devuelve el payload mas grande, asi que es el que
  # mas gana con compresion: el historial completo comprime muy bien.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 512

spring:
  application:
    name: bff-web

bff:
  core:
    cuentas-url: http://localhost:8081
    movimientos-url: http://localhost:8082

logging:
  level:
    root: INFO
    cl.duoc.bancoxyz.bff: INFO
